// Gradle build file for this standalone project. Not part of the upstream AOSP repo
// (which builds this via Android.bp/Soong) — added so this vendored copy of
// frameworks/libs/systemui/iconloaderlib can compile under Gradle/AGP.
// Mirrors the upstream "iconloader_base" Android.bp target: src/ only (not src_full_lib),
// public SDK only.
plugins {
    id 'com.android.library'
}

android {
    namespace "com.android.launcher3.icons"
    compileSdk 36

    defaultConfig {
        minSdk 31
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            kotlin.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation project(':flags-stub')
}
